<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>迷宫画面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800&display=swap">
<style>
body{margin:0}
a{color:#e8d48a}a:hover{color:#fff1b8}
.map{background-image:url(../img/dungeon-moss.png);background-size:cover;background-position:center;image-rendering:pixelated}
.mon{image-rendering:pixelated}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var TC = { 一般: '#5f5e50', 水: '#2b5f8a', 火: '#a8482a', 草: '#3f7a3a' };
  var D = { 撞击: ['物理', 6, '95%', '用整个身体撞向对手进行攻击。'], 水枪: ['特殊', 5, '88%', '向对手猛烈地喷射水流进行攻击。'], 抓: ['物理', 6, '90%', '用坚硬且无比锋利的爪子抓对手进行攻击。'], 火花: ['特殊', 7, '88%', '向对手发射小型火焰进行攻击。有时会让对手陷入灼伤状态。'], 种子炸弹: ['物理', 16, '88%', '将许多外壳坚硬的大种子从上方砸下攻击对手。'] };
  var GRID = Array.from({ length: 25 }, function (_, i) { return i === 12 ? '#7fbfef' : i === 7 ? '#e8d48a' : [6, 8, 11, 13, 16, 17, 18].indexOf(i) >= 0 ? '#6b6240' : '#2a332d'; });
  function mv(name, type, pp) {
    var d = D[name];
    return { name: name, type: type, pp: pp, empty: false, bg: TC[type], border: '1px solid rgba(255,255,255,0.18)', tip: { name: name, type: type, pp: pp, bg: TC[type], cat: d[0], pow: d[1], acc: d[2], desc: d[3], grid: GRID } };
  }
  var none = { name: '', type: '', pp: '', empty: true, bg: '#141c18', border: '1px dashed #3d4a40', tip: null };
  function buff(t) { return { text: t, bg: '#2f6a3a' }; }
  function debuff(t) { return { text: t, bg: '#7a2f2f' }; }
  var members = [
    { id: 'squirtle', name: '杰尼龟', hp: '16/20', pct: '80%', hpColor: '#6ccf6c', img: '../img/squirtle.png', status: [debuff('防御↓1')], moves: [mv('撞击', '一般', '30/30'), mv('水枪', '水', '14/17'), none, none] },
    { id: 'charmander', name: '小火龙', hp: '10/19', pct: '53%', hpColor: '#e8c34a', img: '../img/charmander.png', status: [buff('攻击↑1'), debuff('防御↓1')], moves: [mv('抓', '一般', '25/28'), mv('火花', '火', '11/15'), none, none] },
    { id: 'bulbasaur', name: '妙蛙种子', hp: '21/21', pct: '100%', hpColor: '#6ccf6c', img: '../img/bulbasaur.png', status: [debuff('防御↓1')], moves: [mv('撞击', '一般', '30/30'), mv('种子炸弹', '草', '9/11'), none, none] }
  ];
  function item(text) { return { text: text, bg: '#1f2b24', border: '1px solid #4d5d50' }; }
  var slot = { text: '', bg: '#141c18', border: '1px dashed #3d4a40' };
  var quick = [item('橙橙果 ×2'), item('PP剂 ×1'), item('大树果 ×1'), slot, slot, slot].map(function (q, i) { q.label = ['橙橙果 ×2', 'PP多项小补剂 ×1', '大树果 ×1', '空快捷格', '空快捷格', '空快捷格'][i]; return q; });
  var ALL = [
    { text: '橙橙果\n×2', cat: 'berry' }, { text: '大树果\n×1', cat: 'berry' },
    { text: 'PP多项\n小补剂 ×1', cat: 'drink' }, { text: '全员\nPP补剂 ×1', cat: 'drink' },
    { text: '招式机\n守住', cat: 'tm' }, { text: '招式机\n光墙', cat: 'tm' }
  ];
  var TABS = [['all', '全部'], ['berry', '树果'], ['drink', '补剂'], ['tm', '招式机'], ['other', '其他']];

  var st = new URLSearchParams(location.search).get('state') || 'default';
  var active = st === 'switch' ? 'charmander' : 'squirtle';
  var bag = st === 'bag', bagTab = st === 'bag' ? 'berry' : 'all';
  var tipOn = st === 'hover' ? 1 : null;

  function tipHtml(t) {
    if (!t) return '';
    var grid = t.grid.map(function (c) { return '<span style="background: ' + c + '; border-radius: 2px"></span>'; }).join('');
    return '<div style="position: absolute; left: 310px; bottom: 126px; width: 380px; padding: 12px 14px; background: rgba(12,18,15,0.96); border: 1px solid #e8d48a; border-radius: 12px; box-sizing: border-box; display: flex; gap: 14px">' +
      '<div role="img" aria-label="范围示意" style="display: grid; grid-template-columns: repeat(5, 12px); grid-auto-rows: 12px; gap: 2px; align-self: center">' + grid + '</div>' +
      '<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">' +
      '<div style="display: flex; gap: 8px; align-items: center"><span style="font-size: 16px; font-weight: 700">' + t.name + '</span><span style="font-size: 11px; padding: 1px 7px; border-radius: 9px; background: ' + t.bg + '">' + t.type + '</span><span style="font-size: 11px; padding: 1px 7px; border-radius: 9px; background: #2a3a30">' + t.cat + '</span></div>' +
      '<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 11px">' +
      '<span><span style="display: block; color: #8f8a78">威力</span>' + t.pow + '</span><span><span style="display: block; color: #8f8a78">命中</span>' + t.acc + '</span><span><span style="display: block; color: #8f8a78">PP</span>' + t.pp + '</span><span><span style="display: block; color: #8f8a78">射程</span>1 格</span><span><span style="display: block; color: #8f8a78">范围</span>单体</span></div>' +
      '<div style="font-size: 12px; color: #d6d0bc; line-height: 1.5">' + t.desc + '</div></div></div>';
  }

  function render() {
    var cur = members.filter(function (m) { return m.id === active; })[0];
    var team = members.map(function (t) {
      var on = t.id === active;
      var status = t.status.map(function (s) { return '<span style="font-size: 10px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: ' + s.bg + '">' + s.text + '</span>'; }).join('');
      return '<button type="button" data-id="' + t.id + '" aria-pressed="' + on + '" style="font: inherit; color: inherit; text-align: left; width: 236px; padding: 6px 10px; background: rgba(10,15,12,0.85); border: ' + (on ? '2px solid #fff1b8' : '1px solid #3d4a40') + '; border-radius: 10px; box-sizing: border-box; display: flex; gap: 8px; align-items: center; cursor: pointer">' +
        '<img class="mon" src="' + t.img + '" alt="" style="height: 34px; width: 34px; object-fit: contain">' +
        '<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">' +
        '<span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span>' + t.name + '</span><span style="font-size: 11px; color: #c9c4b0">' + t.hp + '</span></span>' +
        '<span style="height: 6px; background: #2a2f2a; border-radius: 4px"><span style="display: block; width: ' + t.pct + '; height: 6px; background: ' + t.hpColor + '; border-radius: 4px"></span></span>' +
        '<span style="display: flex; gap: 4px; min-height: 16px">' + status + '</span></span></button>';
    }).join('');
    var moves = cur.moves.map(function (m, i) {
      return '<button type="button" data-mi="' + i + '"' + (m.empty ? ' disabled' : '') + ' style="font: inherit; color: #f2eee0; text-align: left; background: ' + m.bg + '; border: ' + m.border + '; border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer">' +
        '<span style="font-size: 16px; font-weight: 700">' + m.name + '</span>' +
        '<span style="display: flex; justify-content: space-between; font-size: 11px; color: rgba(242,238,224,0.8)"><span>' + m.type + '</span><span>' + m.pp + '</span></span></button>';
    }).join('');
    var quickBar = quick.map(function (q) {
      return '<button type="button" aria-label="' + q.label + '" style="width: 60px; height: 44px; box-sizing: border-box; overflow: hidden; font: inherit; font-size: 11px; color: inherit; background: ' + q.bg + '; border: ' + q.border + '; border-radius: 8px; line-height: 1.25; padding: 2px">' + q.text + '</button>';
    }).join('');
    var bagHtml = '';
    if (bag) {
      var qs = quick.map(function (q) { return '<div style="width: 76px; height: 56px; box-sizing: border-box; font-size: 12px; background: ' + q.bg + '; border: ' + q.border + '; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.3">' + q.text + '</div>'; }).join('');
      var tabs = TABS.map(function (t) {
        var on = t[0] === bagTab;
        return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + on + '" style="font: inherit; font-size: 13px; color: ' + (on ? '#0b0f0d' : '#f2eee0') + '; background: ' + (on ? '#e8d48a' : 'transparent') + '; border: 1px solid #4d5d50; border-radius: 16px; height: 32px; padding: 0 14px; cursor: pointer">' + t[1] + '</button>';
      }).join('');
      var its = ALL.filter(function (x) { return bagTab === 'all' || x.cat === bagTab; }).map(function (it) { return '<div style="width: 76px; height: 56px; box-sizing: border-box; font-size: 12px; background: #1f2b24; border: 1px solid #4d5d50; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.3; white-space: pre-line">' + it.text + '</div>'; }).join('');
      bagHtml = '<div style="position: absolute; left: 330px; top: 120px; width: 620px; padding: 18px; background: rgba(12,18,15,0.96); border: 2px solid #e8d48a; border-radius: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">' +
        '<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 19px; font-weight: 800">背包</span><button type="button" id="bagclose" aria-label="关闭" style="font: inherit; color: inherit; background: transparent; border: 1px solid #4d5d50; border-radius: 8px; width: 44px; height: 36px; cursor: pointer">✕</button></div>' +
        '<div style="font-size: 13px; color: #c9c4b0">快捷物品</div>' +
        '<div style="display: grid; grid-template-columns: repeat(6, 76px); grid-auto-rows: 56px; gap: 8px">' + qs + '</div>' +
        '<div role="tablist" style="display: flex; gap: 6px">' + tabs + '</div>' +
        '<div style="display: grid; grid-template-columns: repeat(6, 76px); grid-auto-rows: 56px; gap: 8px; min-height: 120px">' + its + '</div></div>';
    }
    document.getElementById('root').innerHTML =
'<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0b0f0d; font-family: \'Noto Sans SC\', system-ui, sans-serif; color: #f2eee0">' +
'<div class="map" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 610px"></div>' +
'<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 610px; background: radial-gradient(circle at 650px 330px, rgba(22,26,18,0) 0, rgba(22,26,18,0) 120px, rgba(22,26,18,0.3) 190px, rgba(22,26,18,0.58) 280px, rgba(16,18,14,0.62) 520px, rgba(10,12,10,0.82) 760px)"></div>' +
'<div style="position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px">' + team + '</div>' +
'<div style="position: absolute; right: 14px; top: 14px; width: 220px; padding: 8px; background: rgba(10,15,12,0.85); border-radius: 10px; box-sizing: border-box">' +
'<div style="display: flex; justify-content: space-between; font-size: 12px; color: #c9c4b0"><span>苔石洞 1F</span><span>第 42 轮</span></div>' +
'<div aria-hidden="true" style="margin-top: 6px; height: 116px; background: #121814; border-radius: 6px; position: relative">' +
'<div style="position: absolute; left: 18px; top: 18px; width: 52px; height: 34px; border: 2px solid #8a9a7a"></div>' +
'<div style="position: absolute; left: 70px; top: 34px; width: 40px; height: 2px; background: #8a9a7a"></div>' +
'<div style="position: absolute; left: 110px; top: 22px; width: 64px; height: 44px; border: 2px solid #8a9a7a"></div>' +
'<div style="position: absolute; left: 140px; top: 42px; width: 7px; height: 7px; background: #fff1b8; border-radius: 50%"></div>' +
'<div style="position: absolute; left: 154px; top: 52px; width: 6px; height: 6px; background: #e06060; border-radius: 50%"></div></div></div>' +
'<div style="position: absolute; right: 14px; top: 176px; width: 220px; padding: 10px 12px; background: rgba(10,15,12,0.85); border-radius: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px; font-size: 12px">' +
'<div style="color: #e8d48a; font-weight: 600">委托 1/3</div><div>猎手 · 本层再击倒 2 只</div><div style="color: #e8d48a; font-weight: 600; margin-top: 4px">祝福</div><div>号召 · 招募概率 45％</div></div>' +
'<div style="position: absolute; left: 14px; bottom: 132px; width: 500px; padding: 8px 12px; background: rgba(10,15,12,0.7); border-radius: 10px; font-size: 13px; line-height: 1.65">' +
'<div style="color: #8f8a78">小火龙 的 火花！小拉达 受到 8 点伤害</div><div style="color: #b9b3a0">小拉达 陷入了 灼伤</div><div>杰尼龟 捡到了 橙橙果</div></div>' +
'<div style="position: absolute; right: 14px; bottom: 132px; padding: 8px 12px; background: rgba(10,15,12,0.55); border-radius: 8px; font-size: 11px; line-height: 1.75; color: #d6d0bc; display: grid; grid-template-columns: auto auto; column-gap: 10px">' +
'<span style="color: #e8d48a">WASD</span><span>移动</span><span style="color: #e8d48a">W+D 等</span><span>斜向移动</span><span style="color: #e8d48a">1—4</span><span>招式</span><span style="color: #e8d48a">5—0</span><span>快捷物品</span><span style="color: #e8d48a">Tab</span><span>切换操控</span><span style="color: #e8d48a">B</span><span>背包</span></div>' +
'<div style="position: absolute; left: 0; bottom: 0; width: 1280px; height: 118px; background: linear-gradient(180deg, #18211c, #101612); border-top: 2px solid #4d5d50; box-sizing: border-box; padding: 10px 16px; display: flex; gap: 14px; align-items: stretch">' +
'<div style="width: 286px; display: flex; flex-direction: column; gap: 6px">' +
'<div style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: #c9c4b0"><span style="white-space: nowrap">队伍 Lv7</span><span style="flex: 1; height: 5px; background: #2a2f2a; border-radius: 3px"><span style="display: block; width: 34%; height: 5px; background: #7fb3e8; border-radius: 3px"></span></span><span style="white-space: nowrap">12/35</span></div>' +
'<div style="flex: 1; display: flex; gap: 10px; align-items: center">' +
'<div style="width: 70px; height: 70px; border-radius: 12px; background: radial-gradient(circle at 50% 70%, #2a3a30 0, #141c18 75%); display: flex; align-items: center; justify-content: center"><img class="mon" src="' + cur.img + '" alt="' + cur.name + '" style="height: 56px"></div>' +
'<div style="flex: 1; display: flex; flex-direction: column; gap: 5px"><div style="font-size: 17px; font-weight: 800">' + cur.name + '</div><div style="height: 10px; background: #2a2f2a; border-radius: 5px"><div style="width: ' + cur.pct + '; height: 10px; background: ' + cur.hpColor + '; border-radius: 5px"></div></div><div style="font-size: 12px; color: #c9c4b0">HP ' + cur.hp + '</div></div></div></div>' +
'<div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">' + moves + '</div>' +
'<div style="display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 44px); gap: 6px; align-content: center">' + quickBar + '</div>' +
'<div style="display: flex; align-items: center"><button type="button" id="bagbtn" style="font: inherit; font-size: 14px; font-weight: 600; color: #0b0f0d; background: #e8d48a; border: 0; border-radius: 24px; width: 92px; height: 48px; cursor: pointer">背包</button></div></div>' +
'<div id="tip">' + tipHtml(tipOn !== null ? cur.moves[tipOn].tip : null) + '</div>' + bagHtml + '</div>';
    var root = document.getElementById('root');
    root.querySelectorAll('button[data-id]').forEach(function (b) { b.onclick = function () { active = b.getAttribute('data-id'); tipOn = null; render(); }; });
    root.querySelectorAll('button[data-mi]').forEach(function (b) {
      var i = +b.getAttribute('data-mi'), tip = document.getElementById('tip');
      function on() { tip.innerHTML = tipHtml(cur.moves[i].tip); }
      function off() { tip.innerHTML = ''; }
      b.onmouseenter = on; b.onmouseleave = off; b.onfocus = on; b.onblur = off;
    });
    document.getElementById('bagbtn').onclick = function () { bag = !bag; render(); };
    var bc = document.getElementById('bagclose');
    if (bc) bc.onclick = function () { bag = false; render(); };
    root.querySelectorAll('button[data-tab]').forEach(function (b) { b.onclick = function () { bagTab = b.getAttribute('data-tab'); render(); }; });
  }
  render();
})();
</script>
</body>
</html>
