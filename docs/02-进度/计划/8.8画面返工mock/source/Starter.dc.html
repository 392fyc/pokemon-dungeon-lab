<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择起始伙伴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800&amp;display=swap">
<style>
body{margin:0}
a{color:#e8d48a}a:hover{color:#fff1b8}
.mon{image-rendering:pixelated}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: radial-gradient(circle at 50% 30%, #1a241e 0, #0b0f0d 70%); font-family: 'Noto Sans SC', system-ui, sans-serif; color: #f2eee0; padding: 28px 80px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Title.dc.html" style="font-size: 14px; text-decoration: none; color: #c9c4b0">‹ 返回标题</a>
    <div style="font-size: 14px; color: #c9c4b0">选一只宝可梦，和你一起出发</div>
    <div style="width: 80px"></div>
  </div>

  <div style="display: flex; gap: 28px; background: rgba(19,26,22,0.9); border: 1px solid #3d4a40; border-radius: 16px; padding: 22px 28px; height: 400px; box-sizing: border-box">
    <!-- 立绘与名字 -->
    <div style="width: 200px; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="width: 190px; height: 190px; border-radius: 18px; background: radial-gradient(circle at 50% 70%, #2a3a30 0, #141c18 70%); display: flex; align-items: center; justify-content: center">
        <img class="mon" src="{{cur.img}}" alt="{{cur.name}}" style="height: 150px">
      </div>
      <div style="font-size: 30px; font-weight: 800">{{cur.name}}</div>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{cur.types}}" as="ty" hint-placeholder-count="1">
          <span style="font-size: 13px; padding: 3px 12px; border-radius: 12px; background: {{ty.color}}">{{ty.name}}</span>
        </sc-for>
      </div>
      <a href="Camp.dc.html" style="margin-top: 8px; width: 170px; height: 52px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 19px; font-weight: 800; color: #0b0f0d; background: #e8d48a; border-radius: 12px">就选它</a>
    </div>

    <!-- 能力：六边图 -->
    <div style="width: 300px; display: flex; align-items: center; justify-content: center">
      <div style="position: relative; width: 290px; height: 290px">
      <svg width="290" height="290" style="position: absolute; left: 0; top: 0" viewBox="-145 -145 290 290" overflow="visible" role="img" aria-label="{{cur.statsLabel}}">
        <polygon points="{{hex100}}" fill="none" stroke="#3d4a40" stroke-width="1"></polygon>
        <polygon points="{{hex66}}" fill="none" stroke="#2f3a33" stroke-width="1"></polygon>
        <polygon points="{{hex33}}" fill="none" stroke="#2f3a33" stroke-width="1"></polygon>
        <line x1="0" y1="0" x2="{{ax0.x}}" y2="{{ax0.y}}" stroke="#2f3a33" stroke-width="1"></line>
        <line x1="0" y1="0" x2="{{ax1.x}}" y2="{{ax1.y}}" stroke="#2f3a33" stroke-width="1"></line>
        <line x1="0" y1="0" x2="{{ax2.x}}" y2="{{ax2.y}}" stroke="#2f3a33" stroke-width="1"></line>
        <line x1="0" y1="0" x2="{{ax3.x}}" y2="{{ax3.y}}" stroke="#2f3a33" stroke-width="1"></line>
        <line x1="0" y1="0" x2="{{ax4.x}}" y2="{{ax4.y}}" stroke="#2f3a33" stroke-width="1"></line>
        <line x1="0" y1="0" x2="{{ax5.x}}" y2="{{ax5.y}}" stroke="#2f3a33" stroke-width="1"></line>
        <polygon points="{{cur.radar}}" fill="rgba(232,212,138,0.35)" stroke="#e8d48a" stroke-width="2"></polygon>
      </svg>
      <sc-for list="{{cur.dots}}" as="d" hint-placeholder-count="6">
        <span style="position: absolute; left: {{d.left}}; top: {{d.top}}; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: {{d.color}}; box-shadow: 0 0 0 2px #131a16"></span>
      </sc-for>
      <sc-for list="{{cur.labels}}" as="lb" hint-placeholder-count="6">
        <div style="position: absolute; left: {{lb.left}}; top: {{lb.top}}; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; line-height: 1.2">
          <div style="font-size: 12px; font-weight: 600; color: {{lb.color}}">{{lb.name}}</div>
          <div style="font-size: 15px; font-weight: 700; color: #f2eee0">{{lb.value}}</div>
        </div>
      </sc-for>
      </div>
    </div>

    <!-- 招式（官方格式） -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center">
      <sc-for list="{{cur.moves}}" as="m" hint-placeholder-count="2">
        <div onMouseEnter="{{m.enter}}" onMouseLeave="{{m.leave}}" style="position: relative; padding: 10px 14px; background: #1f2b24; border: 1px solid #4d5d50; border-radius: 12px; display: flex; gap: 14px">
          <div aria-label="范围示意：自己在中间，亮格是会打到的格子" role="img" style="display: grid; grid-template-columns: repeat(5, 14px); grid-auto-rows: 14px; gap: 2px; align-self: center">
            <sc-for list="{{m.grid}}" as="c" hint-placeholder-count="25">
              <span style="background: {{c}}; border-radius: 2px"></span>
            </sc-for>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-size: 17px; font-weight: 700">{{m.name}}</span>
              <span style="font-size: 12px; padding: 2px 8px; border-radius: 10px; background: {{m.typeColor}}">{{m.type}}</span>
              <span style="font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #2a3a30">{{m.cat}}</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 12px">
              <span><span style="display: block; color: #8f8a78">威力</span>{{m.pow}}</span>
              <span><span style="display: block; color: #8f8a78">命中</span>{{m.acc}}</span>
              <span><span style="display: block; color: #8f8a78">PP</span>{{m.pp}}</span>
              <span><span style="display: block; color: #8f8a78">射程</span>{{m.reach}}</span>
              <span><span style="display: block; color: #8f8a78">范围</span>{{m.area}}</span>
            </div>
            <sc-if value="{{m.showDesc}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; right: 0; top: 100%; margin-top: 6px; z-index: 2; padding: 10px 14px; background: rgba(12,18,15,0.97); border: 1px solid #e8d48a; border-radius: 10px; font-size: 13px; color: #e6e1cf; line-height: 1.6">{{m.desc}}</div></sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{mons}}" as="mon" hint-placeholder-count="8">
      <button type="button" aria-label="{{mon.name}}" aria-pressed="{{mon.selected}}" onClick="{{mon.pick}}" style="font: inherit; color: inherit; height: 112px; background: {{mon.bg}}; border: {{mon.border}}; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
        <img class="mon" src="{{mon.img}}" alt="" style="height: 58px">
        <span style="font-size: 13px">{{mon.name}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 'squirtle' }; }
  renderVals() {
    const T = { 草: '#3f7a3a', 毒: '#6a3f8a', 火: '#a8482a', 水: '#2b5f8a', 一般: '#6a6a5a' };
    const ON = '#e8d48a', ME = '#7fbfef', OFF = '#2a332d';
    const DIM = '#6b6240';
    const ring8 = [6, 7, 8, 11, 13, 16, 17, 18];
    const front = Array.from({ length: 25 }, (_, i) => (i === 12 ? ME : i === 7 ? ON : ring8.includes(i) ? DIM : OFF));
    const DESC = { 撞击: '用整个身体撞向对手进行攻击。', 抓: '用坚硬且无比锋利的爪子抓对手进行攻击。', 拍击: '使用长长的尾巴或手等拍打对手进行攻击。', 火花: '向对手发射小型火焰进行攻击。有时会让对手陷入灼伤状态。', 水枪: '向对手猛烈地喷射水流进行攻击。', 种子炸弹: '将许多外壳坚硬的大种子从上方砸下攻击对手。', 魔法叶: '散落可以追踪对手的神奇叶片。', 树叶: '将叶片打向对手，进行攻击。' };
    const mv = (name, type, cat, pow, acc, pp) => ({ name, type, typeColor: T[type], cat, pow, acc, pp, reach: '1 格（含斜向）', area: '面朝的一格 · 单体', grid: front, desc: DESC[name] });
    const TACKLE = mv('撞击', '一般', '物理', 6, '95%', 30), SCRATCH = mv('抓', '一般', '物理', 6, '90%', 28), POUND = mv('拍击', '一般', '物理', 6, '90%', 27);
    const EMBER = mv('火花', '火', '特殊', 7, '88%', 15), WATERGUN = mv('水枪', '水', '特殊', 5, '88%', 17);
    const S = (hp, atk, def, spa, spd, spe) => [['HP', hp, '#6ccf6c'], ['攻击', atk, '#e8a04a'], ['防御', def, '#e8d04a'], ['特攻', spa, '#6aa8e8'], ['特防', spd, '#7ad0a8'], ['速度', spe, '#e87aa8']].map(([label, value, color]) => ({ label, value, color, pct: Math.round(value / 80 * 100) + '%' }));
    const ty = (...names) => names.map((n) => ({ name: n, color: T[n] }));
    const R = 92, ang = (i) => (-90 + i * 60) * Math.PI / 180;
    const pt = (i, r) => (r * Math.cos(ang(i))).toFixed(1) + ',' + (r * Math.sin(ang(i))).toFixed(1);
    const ring = (f) => [0, 1, 2, 3, 4, 5].map((i) => pt(i, R * f)).join(' ');
    const radarOf = (st) => {
      const radar = st.map((s, i) => pt(i, R * Math.min(s.value, 100) / 100)).join(' ');
      const labels = st.map((s, i) => { const x = 124 * Math.cos(ang(i)), y = 124 * Math.sin(ang(i)); return { left: (145 + x).toFixed(1) + 'px', top: (145 + y).toFixed(1) + 'px', name: s.label, value: s.value, color: s.color }; });
      const dots = st.map((s, i) => { const r = R * Math.min(s.value, 100) / 100; return { left: (145 + r * Math.cos(ang(i))).toFixed(1) + 'px', top: (145 + r * Math.sin(ang(i))).toFixed(1) + 'px', color: s.color }; });
      return { radar, labels, dots, statsLabel: st.map((s) => s.label + s.value).join('，') };
    };
    const list = [
      { id: 'bulbasaur', name: '妙蛙种子', types: ty('草', '毒'), hp: 21, stats: S(45, 49, 49, 65, 65, 45), img: '/_blob/17dbff1ca9e0f7160b16ceb9d11628bc', moves: [TACKLE, mv('种子炸弹', '草', '物理', 16, '88%', 11)] },
      { id: 'charmander', name: '小火龙', types: ty('火'), hp: 19, stats: S(39, 52, 43, 60, 50, 65), img: '/_blob/601a86936a8f911e833508b9e64a6cf5', moves: [SCRATCH, EMBER] },
      { id: 'squirtle', name: '杰尼龟', types: ty('水'), hp: 20, stats: S(44, 48, 65, 50, 64, 43), img: '/_blob/d4d532ca9fcb9069ef5d855955b8b4c6', moves: [TACKLE, WATERGUN] },
      { id: 'chikorita', name: '菊草叶', types: ty('草'), hp: 21, stats: S(45, 49, 65, 49, 65, 45), img: '/_blob/6674adf3f6457774086f5ee4660baf83', moves: [TACKLE, mv('魔法叶', '草', '特殊', 12, '必中', 8)] },
      { id: 'cyndaquil', name: '火球鼠', types: ty('火'), hp: 19, stats: S(39, 52, 43, 60, 50, 65), img: '/_blob/c1e35732fd84f6cba000404b060d94f0', moves: [TACKLE, EMBER] },
      { id: 'totodile', name: '小锯鳄', types: ty('水'), hp: 22, stats: S(50, 65, 64, 44, 48, 43), img: '/_blob/63727d8a6b7bf5bda8ff199a3e154b8d', moves: [SCRATCH, WATERGUN] },
      { id: 'treecko', name: '木守宫', types: ty('草'), hp: 20, stats: S(40, 45, 35, 65, 55, 70), img: '/_blob/a8d308c524be8ee61797db55bc8341a2', moves: [POUND, mv('树叶', '草', '物理', 6, '—', '—')] },
      { id: 'torchic', name: '火稚鸡', types: ty('火'), hp: 21, stats: S(45, 60, 40, 70, 50, 45), img: '/_blob/cf35fb812f58bbdcea618514cc99058a', moves: [SCRATCH, EMBER] }
    ];
    const picked = this.state.picked;
    const mons = list.map((m) => ({
      ...m,
      selected: m.id === picked ? 'true' : 'false',
      bg: m.id === picked ? '#22302a' : 'rgba(19,26,22,0.9)',
      border: m.id === picked ? '3px solid #e8d48a' : '1px solid #3d4a40',
      pick: () => this.setState({ picked: m.id })
    }));
    const c0 = list.find((m) => m.id === picked);
    const c = { ...c0, moves: c0.moves.map((m, i) => ({ ...m, showDesc: this.state.hover === i, enter: () => this.setState({ hover: i }), leave: () => this.setState({ hover: null }) })) };
    const cur = { ...c, ...radarOf(c.stats) };
    const axes = [0, 1, 2, 3, 4, 5].map((i) => ({ x: (R * Math.cos(ang(i))).toFixed(1), y: (R * Math.sin(ang(i))).toFixed(1) }));
    const out = { mons, cur, hex100: ring(1), hex66: ring(0.66), hex33: ring(0.33) };
    axes.forEach((a, i) => { out['ax' + i] = a; });
    return out;
  }
}
</script>
</body>
</html>
