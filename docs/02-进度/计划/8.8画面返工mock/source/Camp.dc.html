<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>营地</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800&amp;display=swap">
<style>
body{margin:0}
a{color:#e8d48a}a:hover{color:#fff1b8}
.mon{image-rendering:pixelated}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #3d5a2e; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #f2eee0">
  <!-- 地面：草地、土路、广场 -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background-color: #4f6e38; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), radial-gradient(rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 14px 14px, 22px 22px; background-position: 0 0, 7px 9px"></div>
  <div aria-hidden="true" style="position: absolute; left: 590px; top: 150px; width: 100px; height: 280px; background: #9a8458"></div>
  <div aria-hidden="true" style="position: absolute; left: 240px; top: 390px; width: 800px; height: 70px; background: #9a8458"></div>
  <div aria-hidden="true" style="position: absolute; left: 470px; top: 330px; width: 340px; height: 190px; border-radius: 50%; background: #a8926a"></div>
  <div aria-hidden="true" style="position: absolute; left: 618px; top: 400px; width: 44px; height: 30px; border-radius: 50%; background: #3a2a1a; box-shadow: 0 0 34px 14px rgba(255,170,60,0.4)"></div>

  <!-- 北：迷宫入口 -->
  <a href="Main.dc.html" style="position: absolute; left: 520px; top: 20px; width: 240px; height: 150px; text-decoration: none; color: #f2eee0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end">
    <span aria-hidden="true" style="width: 220px; height: 120px; background: #4a4038; border: 4px solid #2c241c; border-radius: 110px 110px 0 0; display: flex; align-items: flex-end; justify-content: center"><span style="width: 90px; height: 70px; background: #0e0b08; border-radius: 45px 45px 0 0"></span></span>
    <span style="margin-top: -2px; font-size: 14px; font-weight: 800; background: rgba(12,18,15,0.8); padding: 2px 10px; border-radius: 6px">迷宫入口</span>
  </a>

  <!-- 设施：建筑＋看守的宝可梦 -->
  <sc-for list="{{facilities}}" as="f" hint-placeholder-count="4">
    <button type="button" onClick="{{f.open}}" aria-label="{{f.name}}" style="position: absolute; left: {{f.x}}; top: {{f.y}}; width: 230px; height: 190px; font: inherit; color: inherit; background: transparent; border: 0; padding: 0; cursor: pointer">
      <span aria-hidden="true" style="position: absolute; left: 20px; top: 0; width: 150px; height: 46px; background: {{f.roof}}; clip-path: polygon(50% 0, 100% 100%, 0 100%)"></span>
      <span aria-hidden="true" style="position: absolute; left: 30px; top: 46px; width: 130px; height: 84px; background: {{f.wall}}; border: 3px solid rgba(0,0,0,0.35); box-sizing: border-box"></span>
      <span aria-hidden="true" style="position: absolute; left: 80px; top: 84px; width: 30px; height: 46px; background: #2c1f14"></span>
      <img class="mon" src="{{f.npc}}" alt="" style="position: absolute; left: 168px; top: 70px; height: 62px">
      <span style="position: absolute; left: 0; top: 146px; width: 230px; text-align: center; font-size: 14px; font-weight: 800; text-shadow: 0 1px 2px #000">{{f.name}}</span>
      <span style="position: absolute; left: 0; top: 168px; width: 230px; text-align: center; font-size: 12px; color: #f0e8d0; text-shadow: 0 1px 2px #000">{{f.sub}}</span>
    </button>
  </sc-for>

  <!-- 队伍站在营火旁 -->
  <div style="position: absolute; left: 556px; top: 430px; display: flex; gap: 34px; align-items: flex-end">
    <img class="mon" src="/_blob/d4d532ca9fcb9069ef5d855955b8b4c6" alt="杰尼龟" style="height: 58px">
    <img class="mon" src="/_blob/601a86936a8f911e833508b9e64a6cf5" alt="小火龙" style="height: 58px">
  </div>

  <div style="position: absolute; left: 16px; top: 16px; padding: 8px 14px; background: rgba(12,18,15,0.8); border-radius: 10px; display: flex; gap: 18px; font-size: 14px">
    <span>探险队 Lv3</span><span>远征 4 次</span>
  </div>
  <a href="Title.dc.html" style="position: absolute; right: 16px; top: 16px; text-decoration: none; font-size: 14px; color: #f2eee0; background: rgba(12,18,15,0.8); border-radius: 10px; padding: 8px 14px">菜单</a>

  <!-- 设施面板：看守的宝可梦在面板左侧 -->
  <sc-if value="{{panel}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 300px; top: 170px; width: 680px; min-height: 300px; padding: 20px; background: rgba(12,18,15,0.95); border: 2px solid #e8d48a; border-radius: 14px; box-sizing: border-box; display: flex; gap: 20px">
      <div style="width: 120px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 110px; height: 110px; border-radius: 14px; background: radial-gradient(circle at 50% 70%, #2a3a30 0, #141c18 75%); display: flex; align-items: center; justify-content: center"><img class="mon" src="{{panel.npc}}" alt="" style="height: 84px"></div>
        <span style="font-size: 13px; color: #c9c4b0">{{panel.npcName}}</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 20px; font-weight: 800">{{panel.name}}</span><button type="button" aria-label="关闭" onClick="{{close}}" style="font: inherit; color: inherit; background: transparent; border: 1px solid #4d5d50; border-radius: 8px; width: 44px; height: 36px; cursor: pointer">✕</button></div>
        <div style="font-size: 14px; color: #e6e1cf; background: #1a231e; border-radius: 10px; padding: 10px 14px">“{{panel.line}}”</div>
        <sc-if value="{{isParty}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 13px; color: #c9c4b0">出发阵容</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <div style="height: 96px; background: #1f2b24; border: 2px solid #fff1b8; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><img class="mon" src="/_blob/d4d532ca9fcb9069ef5d855955b8b4c6" alt="" style="height: 50px"><span style="font-size: 13px">杰尼龟</span></div>
            <div style="height: 96px; background: #1f2b24; border: 1px solid #4d5d50; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><img class="mon" src="/_blob/601a86936a8f911e833508b9e64a6cf5" alt="" style="height: 50px"><span style="font-size: 13px">小火龙</span></div>
            <div style="height: 96px; background: #171f1b; border: 1px dashed #4d5d50; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #8f8a78">＋</div>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: null }; }
  renderVals() {
    const defs = [
      { id: 'party', name: '伙伴小屋', sub: '出发阵容 · 名册', x: '120px', y: '150px', roof: '#a8483a', wall: '#d8c8a0', npc: '/_blob/4c9138e44564d7761580948cdfccdd4b', npcName: '吉利蛋', line: '大家都在这里休息。要带谁出发呢？' },
      { id: 'store', name: '仓库', sub: '招式机 · 碎片', x: '930px', y: '150px', roof: '#3a5a8a', wall: '#c8c0b0', npc: '/_blob/1f434c88ac9db30a682aba84a6086d71', npcName: '卡比兽', line: '……呼噜……带回来的东西都放好了……' },
      { id: 'talent', name: '天赋石碑', sub: '探险队成长', x: '120px', y: '490px', roof: '#5a5a6e', wall: '#9a9aa8', npc: '/_blob/ddcd2107f361a5a78e77dee68201c5d4', npcName: '凯西', line: '石碑会回应探险队的成长。' },
      { id: 'log', name: '记录板', sub: '战绩 · 上一局', x: '930px', y: '490px', roof: '#7a5a2a', wall: '#d0b880', npc: '/_blob/94de1cbf0921385ba75203e624943eea', npcName: '波波', line: '上一次远征的消息，我都记下来了！' }
    ];
    const open = this.state.open;
    const facilities = defs.map((d) => ({ ...d, open: () => this.setState({ open: d.id }) }));
    return {
      facilities,
      panel: defs.find((d) => d.id === open) || false,
      isParty: open === 'party',
      close: () => this.setState({ open: null })
    };
  }
}
</script>
</body>
</html>
